<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contemporary Peapickers · Art from the other 40 hours</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ffffff;
      --bg-alt:      #f4f4f4;
      --text:        #000000;
      --text-muted:  #555555;
      --border:      #cccccc;
      --border-light:#e0e0e0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 60px 24px 40px;
      border-bottom: 1px solid var(--border-light);
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 600;
    }
    header a {
      display: inline-block;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: underline;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
    .placeholder {
      max-width: 500px;
    }
    .placeholder h2 {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .placeholder p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border: 2px solid #000;
      color: #000;
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    .btn:hover {
      background: #000;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border-light);
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Contemporary Peapickers</h1>
    <a href="index.html">← Back to Peapickers</a>
  </header>
  <main>
    <div class="placeholder">
      <h2>Coming soon</h2>
      <p>This is where art made by the hands that work by day will live.</p>
      <p>If you’re an artist with a day job, this is your future wall.</p>
      <a href="index.html" class="btn">Back home</a>
    </div>
  </main>
  <footer>
    <p>Peapickers · Posters for the hands that create by night and survive by day.</p>
  </footer>
</body>
</html>
